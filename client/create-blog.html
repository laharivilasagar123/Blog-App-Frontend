<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Blog — BlogSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="site-header">
        <div class="container navbar">
            <a href="index.html" class="brand">
                <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
                BlogSphere
            </a>
            <div class="nav-menu" id="navMenu">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#popular-blogs">Explore Blogs</a></li>
                </ul>
                <div class="nav-actions" id="navAuthSlot">
                    <a href="dashboard.html" class="btn btn-outline btn-sm">Dashboard</a>
                </div>
            </div>
            <button type="button" class="hamburger" id="hamburger" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navMenu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main id="main-content" class="page-shell">
        <div class="container">
            <div class="create-blog-shell">
                <div class="form-card">
                    <h1 id="formTitle">Create a New Blog</h1>
                    <p id="formSubtitle">Fill in the details below. You can save a draft and come back later, or publish right away.</p>

                    <form id="createBlogForm" novalidate>
                        <div class="form-grid-2">
                            <div class="form-group">
                                <label for="blogTitle">Blog title</label>
                                <input type="text" id="blogTitle" class="form-control" placeholder="e.g. 5 Lessons From My First Marathon" />
                                <p class="field-error" id="blogTitleError"></p>
                            </div>

                            <div class="form-group">
                                <label for="blogCategory">Category</label>
                                <select id="blogCategory" class="form-control">
                                    <option value="" disabled selected>Select a category</option>
                                    <option value="Technology">Technology</option>
                                    <option value="Travel">Travel</option>
                                    <option value="Food">Food</option>
                                    <option value="Lifestyle">Lifestyle</option>
                                    <option value="Productivity">Productivity</option>
                                    <option value="Writing">Writing</option>
                                    <option value="Education">Education</option>
                                    <option value="Health">Health</option>
                                </select>
                                <p class="field-error" id="blogCategoryError"></p>
                            </div>
                        </div>

                        <div class="form-grid-2">
                            <div class="form-group">
                                <label for="blogAuthor">Author</label>
                                <input type="text" id="blogAuthor" class="form-control" disabled />
                                <p class="field-hint">Posts are published under your account name.</p>
                            </div>

                            <div class="form-group">
                                <label for="blogImage">Featured image URL <span style="font-weight: 400; color: var(--text-muted);">(optional)</span></label>
                                <input type="url" id="blogImage" class="form-control" placeholder="https://example.com/image.jpg" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="blogDescription">Short description</label>
                            <input type="text" id="blogDescription" class="form-control" placeholder="A one-sentence summary shown on blog cards" />
                            <p class="field-error" id="blogDescriptionError"></p>
                        </div>

                        <div class="form-group">
                            <label for="blogContent">Blog content</label>
                            <textarea id="blogContent" class="form-control" placeholder="Write your full post here..."></textarea>
                            <div class="char-counter" id="charCounter">0 / 2000 characters</div>
                            <p class="field-error" id="blogContentError"></p>
                        </div>

                        <div class="form-group">
                            <label for="blogTags">Tags <span style="font-weight: 400; color: var(--text-muted);">(comma-separated)</span></label>
                            <input type="text" id="blogTags" class="form-control" placeholder="e.g. travel, budget, solo" />
                        </div>

                        <div class="form-group">
                            <label>Publishing option</label>
                            <div class="publish-options">
                                <label class="radio-card">
                                    <input type="radio" name="publishStatus" value="draft" checked />
                                    <span>
                                        <strong>Save as Draft</strong>
                                        <span>Keep working on it privately. Only you can see it.</span>
                                    </span>
                                </label>
                                <label class="radio-card">
                                    <input type="radio" name="publishStatus" value="published" />
                                    <span>
                                        <strong>Publish Now</strong>
                                        <span>Make it visible to everyone on the Home page.</span>
                                    </span>
                                </label>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn btn-ghost" id="cancelBlogBtn">Cancel</button>
                            <button type="button" class="btn btn-outline" id="previewBlogBtn">Preview</button>
                            <button type="button" class="btn btn-outline" id="saveDraftBtn">Save Draft</button>
                            <button type="submit" class="btn btn-primary">Publish Blog</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
